<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>冷链车辆预约入场与温控异常协同平台</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>

<!-- 登录页 -->
<div id="loginPage" class="login-wrap">
  <div class="login-card">
    <h1>冷链车辆预约入场<br>与温控异常协同平台</h1>
    <p class="sub">物流园 · 预约排窗 / 闸口 / 月台 / 质检 / 隔离 / 结算 全流程</p>
    <label>账号</label>
    <input id="loginUser" placeholder="如 dispatch">
    <label>密码</label>
    <input id="loginPwd" type="password" placeholder="如 disp123">
    <button class="primary big" onclick="doLogin()">登 录</button>
    <div class="demo-accounts">
      <b>演示账号（点击自动填充）</b>
      <table>
        <tr><th>角色</th><th>账号</th><th>密码</th></tr>
        <tr onclick="fillLogin('admin','admin123')"><td>管理员</td><td>admin</td><td>admin123</td></tr>
        <tr onclick="fillLogin('carrier1','carrier123')"><td>承运商-顺达</td><td>carrier1</td><td>carrier123</td></tr>
        <tr onclick="fillLogin('carrier2','carrier123')"><td>承运商-极光(低分)</td><td>carrier2</td><td>carrier123</td></tr>
        <tr onclick="fillLogin('dispatch','disp123')"><td>园区调度</td><td>dispatch</td><td>disp123</td></tr>
        <tr onclick="fillLogin('qc','qc123')"><td>质检员</td><td>qc</td><td>qc123</td></tr>
        <tr onclick="fillLogin('cs_haixian','cs123')"><td>客服-海得鲜</td><td>cs_haixian</td><td>cs123</td></tr>
        <tr onclick="fillLogin('cs_niunai','cs123')"><td>客服-晨光乳业</td><td>cs_niunai</td><td>cs123</td></tr>
        <tr onclick="fillLogin('settle','settle123')"><td>结算员</td><td>settle</td><td>settle123</td></tr>
      </table>
    </div>
  </div>
</div>

<!-- 主应用 -->
<div id="appPage" style="display:none">
  <header>
    <div class="brand">❄ 冷链协同平台</div>
    <nav>
      <a href="#" onclick="showBoard();return false">调度看板</a>
      <a href="#" onclick="showList();return false">车次列表</a>
      <a href="#" id="navNew" href="#" onclick="showNewForm();return false">提交预约</a>
    </nav>
    <div class="userbox">
      <span id="userInfo"></span>
      <button class="ghost" onclick="doLogout()">退出</button>
    </div>
  </header>

  <main id="main"></main>
</div>

<div id="toast"></div>
<script src="/app.js"></script>
</body>
</html>
